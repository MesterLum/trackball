# Automatically applied by `docker compose up` for local development.
# Deploy using `docker compose -f docker-compose.yml up -d` to omit this file.
services:
  web:
    command: ["serve", "--reload", "--reload-dir", "/app/trackball", "--reload-dir", "/app/web", "--reload-include", "*.po"]
    environment:
      TRACKBALL_DEV_RELOAD: "1"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./trackball:/app/trackball:ro
      - ./web:/app/web:ro
      - ./tests:/app/tests:ro
      - ./build.py:/app/build.py:ro
      - ./presets_bundle.py:/app/presets_bundle.py:ro
      - ./demo.py:/app/demo.py:ro
