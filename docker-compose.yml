services:
  web:
    build: .
    ports:
      - "8000:5000"
    environment:
      TRACKBALL_FN_PREVIEW: "96"     # curve resolution of the live preview (Manifold makes this cheap)
      TRACKBALL_FN_FINAL: "128"      # curve resolution of downloadable STLs
      TRACKBALL_WORKERS: "3"         # parallel OpenSCAD processes
      TRACKBALL_AUTO_RENDER: "1"     # 0 = render previews only on request
    volumes:
      - ./out:/data                  # /data/web (designs + cache) and /data/presets (bundles)
