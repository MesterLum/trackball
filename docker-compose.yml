services:
  web:
    build: .
    ports:
      - "8321:5000"
    environment:
      TRACKBALL_FN_PREVIEW: "32"     # curve resolution of the live preview
      TRACKBALL_FN_FINAL: "96"       # curve resolution of downloadable STLs
      TRACKBALL_WORKERS: "3"         # parallel OpenSCAD processes
      TRACKBALL_AUTO_RENDER: "1"     # 0 = render previews only on request
    volumes:
      - ./out:/data                  # /data/web (designs + cache) and /data/presets (bundles)
