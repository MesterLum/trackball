name: Test and deploy static configurator

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      # Yarn packages, the verified OpenSCAD runtime and Corepack live in .cache; Chromium in ms-playwright.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            ~/.cache/ms-playwright
          key: deps-${{ runner.os }}-${{ hashFiles('yarn.lock', 'package.json', 'scripts/openscad.lock.json') }}
          restore-keys: deps-${{ runner.os }}-
      - name: Choose Pages base path
        env:
          CUSTOM_BASE: ${{ vars.PAGES_BASE_PATH }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CUSTOM_BASE" ]; then
            base="$CUSTOM_BASE"
          elif [ "$repo" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            base="/"
          else
            base="/$repo/"
          fi
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
      - name: Validate and build using the shared justfile
        run: nix develop --command just ci
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
