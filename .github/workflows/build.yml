name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: trackball:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tests (inside the image)
        run: docker run --rm trackball:ci test

      - name: Prebuilt preset bundles (inside the image)
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/data" trackball:ci presets
          ls -la out/presets

      - uses: actions/upload-artifact@v4
        with:
          name: preset-bundles
          path: |
            out/presets/**/*.zip
            out/presets/**/*.png
            out/presets/**/*.md
            out/presets/index.html
          if-no-files-found: error

      # ---- releases: push the image, attach the bundles, publish the gallery
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
      - name: Release with bundle zips
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/presets/*/*.zip
          body: |
            Prebuilt STL bundles for every preset (STLs, photos, BOM, command).
            Run the configurator: `docker run -p 8321:5000 ${{ env.IMAGE }}:${{ github.ref_name }}`
      - name: Upload gallery for Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/presets

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
